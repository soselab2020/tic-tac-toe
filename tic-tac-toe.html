<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>tic-tac-toe</title>
        <style type="text/CSS">
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                display: flex;
                font-family: Calibri;
                font-size: 48px;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            table {
                border: 5px solid black;
                border-collapse: collapse;
            }
            table * {
                border: 1px solid black;
                cursor: pointer;
            }
            .symbol {
                font-family: Calibri;
                font-size: 48px;
            }
            tr {
                height: 100px;
            }
            td {
                width: 100px;
                text-align: center;
            }
        </style>
        <script>
            var count = 0;
            var player = 1;
            function determine(id) {
                var grids = [];
                var isLine = false;
                var currentSelection = document.getElementById(id);

                if (currentSelection.innerHTML) {
                    window.alert("此位置無法選取！");
                } else if (player == 1) {
                    currentSelection.innerHTML = "X";
                    player = 2;
                    count++;
                } else if (player == 2) {
                    currentSelection.innerHTML = "O";
                    player = 1;
                    count++;
                }
                document.getElementById("current-player").innerHTML = player == 1 ? "X" : "O"; // Update current player display

                for (var i = 1; i <= 3; i++) {
                    grids[i] = [];
                    for (var j = 1; j <= 3; j++) {
                        grids[i][j] = document.getElementById("grid" + i + j).innerHTML;
                        console.log("i: " + i + ", j: " + j + ", value: " + grids[i][j]);
                    }
                }

                for (var i = 1; i <= 3; i++) {
                    if (grids[i][1] != "" && grids[i][1] == grids[i][2] && grids[i][2] == grids[i][3]) {
                        isLine = true;
                    }
                    if (grids[1][i] != "" && grids[1][i] == grids[2][i] && grids[2][i] == grids[3][i]) {
                        isLine = true;
                    }
                }

                if (
                    (grids[1][1] != "" && grids[1][1] == grids[2][2] && grids[2][2] == grids[3][3]) ||
                    (grids[3][1] != "" && grids[3][1] == grids[2][2] && grids[2][2] == grids[1][3])
                ) {
                    isLine = true;
                }

                if (isLine == true) {
                    if (currentSelection.innerHTML == "O") {
                        setTimeout(() => {
                            window.alert("O贏了！");
                            location.reload();
                        }, 300);
                    } else if (currentSelection.innerHTML == "X") {
                        setTimeout(() => {
                            window.alert("X贏了！");
                            location.reload();
                        }, 300);
                    }
                } else if (count == 9) {
                    setTimeout(() => {
                        window.alert("平手");
                        location.reload();
                    }, 300);
                }
            }
        </script>
    </head>
    <body>
        <div style="margin-bottom: 1em">現在是玩家 <span id="current-player">X</span> 的回合</div>
        <table id="table" class="symbol">
            <tr>
                <td id="grid11" onclick="determine(id);"></td>
                <td id="grid12" onclick="determine(id);"></td>
                <td id="grid13" onclick="determine(id);"></td>
            </tr>
            <tr>
                <td id="grid21" onclick="determine(id);"></td>
                <td id="grid22" onclick="determine(id);"></td>
                <td id="grid23" onclick="determine(id);"></td>
            </tr>
            <tr>
                <td id="grid31" onclick="determine(id);"></td>
                <td id="grid32" onclick="determine(id);"></td>
                <td id="grid33" onclick="determine(id);"></td>
            </tr>
        </table>
    </body>
</html>
