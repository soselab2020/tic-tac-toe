<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="utf-8">
        <title>tic-tac-toe</title> 
        <style type="text/css">
            body {
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                background-color: #f7f9fc;
                margin: 0;
                padding: 20px;
            }

            h2 {
                color: #333;
                margin-top: 0;
            }

            /* 遊戲規則卡片 */
            .rules-card {
                background-color: #ffffff;
                border: 1px solid #e0e0e0;
                border-left: 5px solid #007bff;
                border-radius: 8px;
                padding: 15px 20px;
                max-width: 500px;
                margin-bottom: 20px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            }

            .rules-card h3 {
                margin-top: 0;
                margin-bottom: 8px;
                color: #007bff;
                font-size: 18px;
            }

            .rules-card ul {
                margin: 0;
                padding-left: 20px;
                color: #555;
                font-size: 14px;
                line-height: 1.6;
            }

            .status-panel {
                margin-bottom: 15px;
                font-size: 20px;
                font-weight: bold;
            }

            .piece-selector {
                display: flex;
                gap: 20px;
                margin-bottom: 20px;
            }

            .player-box {
                border: 2px solid #ccc;
                padding: 10px 15px;
                border-radius: 8px;
                background-color: white;
            }

            .player-box.active {
                border-color: #007bff;
                box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
            }

            .piece-btn {
                margin: 0 5px;
                padding: 5px 10px;
                font-size: 16px;
                cursor: pointer;
                border: 1px solid #888;
                border-radius: 4px;
                background-color: #e9ecef;
            }

            .piece-btn.selected {
                background-color: #28a745;
                color: white;
                border-color: #28a745;
            }

            .piece-btn:disabled {
                background-color: #e0e0e0;
                color: #a0a0a0;
                cursor: not-allowed;
            }

            /* 棋盤樣式 */
            table {
                border-collapse: collapse;
                background-color: white;
            }

            td {
                width: 100px;
                height: 100px;
                text-align: center;
                vertical-align: middle;
                border: 2px solid #333;
                cursor: pointer;
            }

            td:hover {
                background-color: #f0f0f0;
            }

            /* 棋子視覺（大小與顏色） */
            .piece {
                border-radius: 50%;
                color: white;
                font-weight: bold;
                line-height: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: auto;
            }

            .player-X { background-color: #dc3545; } /* X 玩家為紅色 */
            .player-O { background-color: #007bff; } /* O 玩家為藍色 */

            .size-3 { width: 80px; height: 80px; font-size: 28px; } /* 大棋 */
            .size-2 { width: 55px; height: 55px; font-size: 20px; } /* 中棋 */
            .size-1 { width: 30px; height: 30px; font-size: 14px; } /* 小棋 */
        </style>
        <script>
            // 遊戲狀態初始化
            var currentPlayer = 'X'; // X 先手
            var selectedSize = null; // 當前選取的尺寸 (3:大, 2:中, 1:小)

            // 雙方剩餘棋子數量 (大:3, 中:2, 小:1)
            var inventory = {
                'X': { 3: 2, 2: 2, 1: 2 },
                'O': { 3: 2, 2: 2, 1: 2 }
            };

            // 3x3 棋盤，每格都是一個陣列（模擬堆疊）
            var board = [
                [[], [], []],
                [[], [], []],
                [[], [], []]
            ];

            // 選擇棋子尺寸
            function selectSize(size) {
                if (inventory[currentPlayer][size] > 0) {
                    selectedSize = size;
                    updateUI();
                } else {
                    alert("該尺寸的棋子已經用完了！");
                }
            }

            // 落子處理
            function handleCellClick(row, col) {
                if (!selectedSize) {
                    alert("請先選擇要使用的棋子尺寸（大、中、小）！");
                    return;
                }

                var stack = board[row][col];
                var topPiece = stack.length > 0 ? stack[stack.length - 1] : null;

                // 檢查是否符合覆蓋規則（空位 或 尺寸大於頂端棋子）
                if (topPiece === null || selectedSize > topPiece.size) {
                    // 放下棋子
                    stack.push({
                        player: currentPlayer,
                        size: selectedSize
                    });

                    // 扣除棋子數量
                    inventory[currentPlayer][selectedSize]--;
                    selectedSize = null; // 重置選擇

                    // 更新畫面
                    renderBoard();

                    // 檢查是否有人連線獲勝
                    if (checkWin()) {
                        setTimeout(() => {
                            alert("玩家 " + currentPlayer + " 獲勝了！");
                            location.reload();
                        }, 100);
                        return;
                    }

                    // 檢查平手（雙方無棋子可用且無人獲勝）
                    if (checkDraw()) {
                        setTimeout(() => {
                            alert("雙方棋子已用盡，平手！");
                            location.reload();
                        }, 100);
                        return;
                    }

                    // 切換玩家
                    currentPlayer = (currentPlayer === 'X') ? 'O' : 'X';
                    updateUI();
                } else {
                    alert("無法覆蓋！你的棋子必須大於目標格子的棋子。");
                }
            }

            // 檢查勝負條件
            function checkWin() {
                var topBoard = [
                    ['', '', ''],
                    ['', '', ''],
                    ['', '', '']
                ];

                for (var r = 0; r < 3; r++) {
                    for (var c = 0; c < 3; c++) {
                        var stack = board[r][c];
                        if (stack.length > 0) {
                            topBoard[r][c] = stack[stack.length - 1].player;
                        }
                    }
                }

                for (var i = 0; i < 3; i++) {
                    if (topBoard[i][0] !== '' && topBoard[i][0] === topBoard[i][1] && topBoard[i][1] === topBoard[i][2]) return true;
                    if (topBoard[0][i] !== '' && topBoard[0][i] === topBoard[1][i] && topBoard[1][i] === topBoard[2][i]) return true;
                }
                if (topBoard[0][0] !== '' && topBoard[0][0] === topBoard[1][1] && topBoard[1][1] === topBoard[2][2]) return true;
                if (topBoard[0][2] !== '' && topBoard[0][2] === topBoard[1][1] && topBoard[1][1] === topBoard[2][0]) return true;

                return false;
            }

            // 檢查平手條件
            function checkDraw() {
                var xSum = inventory['X'][1] + inventory['X'][2] + inventory['X'][3];
                var oSum = inventory['O'][1] + inventory['O'][2] + inventory['O'][3];
                return (xSum === 0 && oSum === 0);
            }

            // 渲染棋盤內容
            function renderBoard() {
                for (var r = 0; r < 3; r++) {
                    for (var c = 0; c < 3; c++) {
                        var td = document.getElementById("grid" + r + c);
                        var stack = board[r][c];
                        td.innerHTML = ""; 

                        if (stack.length > 0) {
                            var top = stack[stack.length - 1];
                            var pieceDiv = document.createElement("div");
                            pieceDiv.className = "piece player-" + top.player + " size-" + top.size;
                            pieceDiv.innerText = top.player;
                            td.appendChild(pieceDiv);
                        }
                    }
                }
            }

            // 更新 UI 狀態
            function updateUI() {
                document.getElementById("turn-info").innerText = "目前回合：玩家 " + currentPlayer;
                
                document.getElementById("box-X").className = "player-box" + (currentPlayer === 'X' ? " active" : "");
                document.getElementById("box-O").className = "player-box" + (currentPlayer === 'O' ? " active" : "");

                ['X', 'O'].forEach(p => {
                    [1, 2, 3].forEach(s => {
                        var btn = document.getElementById("btn-" + p + "-" + s);
                        var count = inventory[p][s];
                        var sizeName = s === 3 ? "大" : (s === 2 ? "中" : "小");
                        
                        btn.innerText = sizeName + " (" + count + ")";
                        btn.disabled = (p !== currentPlayer) || (count === 0);

                        if (p === currentPlayer && selectedSize === s) {
                            btn.className = "piece-btn selected";
                        } else {
                            btn.className = "piece-btn";
                        }
                    });
                });
            }

            window.onload = function() {
                updateUI();
            };
        </script>
    </head>
    <body>
        <!-- 顯示遊戲規則卡片 -->
        <div class="rules-card">
            <h3>📖 遊戲規則</h3>
            <ul>
                <li><strong>棋子：</strong>雙方各自擁有 3 種尺寸（大、中、小）棋子，每種尺寸各有 2 個。</li>
                <li><strong>輪流落子：</strong>先選擇下方自己的棋子尺寸，再點擊九宮格落子。</li>
                <li><strong>大吃小（覆蓋）：</strong>可放進空格，或蓋在場上任何一個比它小的棋子上方（不限敵我）。</li>
                <li><strong>不可移動：</strong>棋子放到棋盤上後即不可再移動。</li>
                <li><strong>獲勝條件：</strong>率先將自己顏色的 3 個棋子（不限大小）連成一線（橫、豎、斜）者獲勝。</li>
            </ul>
        </div>

        <div id="turn-info" class="status-panel">目前回合：玩家 X</div>

        <!-- 棋子選擇面板 -->
        <div class="piece-selector">
            <div id="box-X" class="player-box">
                <div><strong>玩家 X (紅) 剩餘棋子：</strong></div>
                <button id="btn-X-3" class="piece-btn" onclick="selectSize(3)">大 (2)</button>
                <button id="btn-X-2" class="piece-btn" onclick="selectSize(2)">中 (2)</button>
                <button id="btn-X-1" class="piece-btn" onclick="selectSize(1)">小 (2)</button>
            </div>
            <div id="box-O" class="player-box">
                <div><strong>玩家 O (藍) 剩餘棋子：</strong></div>
                <button id="btn-O-3" class="piece-btn" onclick="selectSize(3)">大 (2)</button>
                <button id="btn-O-2" class="piece-btn" onclick="selectSize(2)">中 (2)</button>
                <button id="btn-O-1" class="piece-btn" onclick="selectSize(1)">小 (2)</button>
            </div>
        </div>

        <!-- 3x3 棋盤 -->
        <table>
            <tr>
                <td id='grid00' onclick="handleCellClick(0, 0);"></td>
                <td id='grid01' onclick="handleCellClick(0, 1);"></td>
                <td id='grid02' onclick="handleCellClick(0, 2);"></td>
            </tr>
            <tr>
                <td id='grid10' onclick="handleCellClick(1, 0);"></td>
                <td id='grid11' onclick="handleCellClick(1, 1);"></td>
                <td id='grid12' onclick="handleCellClick(1, 2);"></td>
            </tr>
            <tr>
                <td id='grid20' onclick="handleCellClick(2, 0);"></td>
                <td id='grid21' onclick="handleCellClick(2, 1);"></td>
                <td id='grid22' onclick="handleCellClick(2, 2);"></td>
            </tr>
        </table>
    </body>
</html>
