<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="utf-8">
		<title>tic-tac-toe</title> 
        <style type = "text/CSS">
            .symbol {
				font-family: Calibri;
				font-size: 48px;
            }
			tr {
				height: 100px;
			}
			td {
				width: 100px;
				text-align: center;
			}
        </style>
        <script>
		var count = 0; 
		var player = 1;
		function checkLine(grids) {
			for (var i = 1; i <= 3; i++) {
				if ((grids[i][1] != "") && (grids[i][1] == grids[i][2]) && (grids[i][2]== grids[i][3])) {
					return [true, [i, 1, 0, 1]]
				}
				if ((grids[1][i] != "") && (grids[1][i] == grids[2][i]) && ( grids[2][i] == grids[3][i])) {
					return [true, [1, i, 1, 0]]
				}				
			}
			
			if ((grids[1][1] != "") && (grids[1][1] == grids[2][2]) && (grids[2][2]== grids[3][3])) {
				return [true, [1, 1, 1, 1]]
			}
			if ((grids[3][1] != "") && (grids[3][1] == grids[2][2]) && (grids[2][2]== grids[1][3])) {
				return [true, [1, 3, 1, -1]]
			}
			return [false, []]
		}

		function setLineHighlight(iter) {
			let [x, y, dx, dy] = iter
			for (var i=1; i<=3; x+=dx, y+=dy, i++) {
				document.getElementById(`grid${x}${y}`).style.color = 'red'
			}
		}

		function determine(id) {
			var grids = [];
			var currentSelection = document.getElementById(id);		

			if (currentSelection.innerHTML) {
				window.alert("此位置無法選取！");
			} else if (player == 1) {
				currentSelection.innerHTML = 'X'; 
				player = 2; 
				count++; 
			} else if (player == 2) {
				currentSelection.innerHTML = 'O'; 
				player = 1; 
				count++;
			}
			
			for (var i = 1; i <= 3; i++) {
				grids[i] = [];
				for (var j = 1; j <= 3; j++) {
					grids[i][j] = document.getElementById("grid" + i + j).innerHTML;
					console.log("i: " + i + ", j: " + j + ", value: " + grids[i][j]);
				}				
			}

			const [isLine, iter] = checkLine(grids)
			
			if (isLine == true) {	
				setLineHighlight(iter)
				let winner = currentSelection.innerHTML
				setTimeout(() => { 
					window.alert(`${winner}贏了！`); 
					location.reload();
				}, 300) ;					
			} else if (count == 9) {
				setTimeout(() => { 
					window.alert("平手"); 
					location.reload();
				}, 300) ;		
			}			
			
		}
             
        </script>
    </head>
    <body>
        <table id="table" border="1px" class="symbol">
            <tr>
                <td id='grid11' onclick="determine(id);"></td>
                <td id='grid12' onclick="determine(id);"></td>
                <td id='grid13' onclick="determine(id);"></td>
            </tr>
            <tr>
                <td id='grid21' onclick="determine(id);"></td>
                <td id='grid22' onclick="determine(id);"></td>
                <td id='grid23' onclick="determine(id);"></td>
            </tr>
            <tr>
                <td id='grid31' onclick="determine(id);"></td>
                <td id='grid32' onclick="determine(id);"></td>
                <td id='grid33' onclick="determine(id);"></td>
            </tr>
        </table>
    </body>
</html>
